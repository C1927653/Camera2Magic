name: Build Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify tag matches versionName
        if: github.ref_type == 'tag'
        run: |
          set -euo pipefail
          major=$(sed -nE 's/^def majorVersion = ([0-9]+).*/\1/p' app/build.gradle)
          minor=$(sed -nE 's/^def minorVersion = ([0-9]+).*/\1/p' app/build.gradle)
          patch=$(sed -nE 's/^def patchVersion = ([0-9]+).*/\1/p' app/build.gradle)
          if [ -z "${major}" ] || [ -z "${minor}" ] || [ -z "${patch}" ]; then
            echo "::error::无法从 app/build.gradle 解析版本号"
            exit 1
          fi
          version_name="${major}.${minor}.${patch}"
          tag="${GITHUB_REF_NAME#v}"
          if [ "${tag}" != "${version_name}" ]; then
            echo "::error::tag 和版本号不一致"
            exit 1
          fi
          echo "tag/versionName 一致：${GITHUB_REF_NAME} == ${version_name}"

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Decode keystore
        run: |
          set -e
          KEY_B64="在此处粘贴你本地 base64 -w 0 cam2magic.keystore 的输出内容"
          echo -n "$KEY_B64" | base64 -d > "$RUNNER_TEMP/cam2magic.keystore"
          test -s "$RUNNER_TEMP/cam2magic.keystore"

      - name: Debug keystore list
        run: |
          keytool -list -v -keystore "$RUNNER_TEMP/cam2magic.keystore" -storepass 12345678

      - name: Build signed release APK
        env:
          CAM2MAGIC_KEYSTORE: ${{ runner.temp }}/cam2magic.keystore
          CAM2MAGIC_KEYSTORE_PASSWORD: 12345678
          CAM2MAGIC_KEY_ALIAS: cam2magic
          CAM2MAGIC_KEY_PASSWORD: 12345678
        run: ./gradlew assembleRelease -x lintVitalRelease

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: cam2magic-release-apk
          path: app/build/outputs/apk/release/*.apk
